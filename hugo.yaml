  education:
    enable: true
    index: false
    items:
      - title: "Master of Business Administration"
        school:
          name: "Heidelberg University, Tiffin Ohio"
          url: "https://www.heidelberg.edu/"
        date: "2023 - 2024"
        GPA: "3.9 out of 4.0"
        content: |-
          - Completed an accelerated MBA program while working full-time.
      - title: "Bachelor of Science in Computer Science, Minors in Music and Business"
        school:
          name: "Heidelberg University, Tiffin Ohio"
          url: "https://www.heidelberg.edu/"
        date: "2019 - 2023"
        GPA: "3.87 out of 4.0"
        content: |-
          - Graduated Magna Cum Laude, inducted into the Heidelberg University Honors Society, dean's list every semester.
          - Recipient of the Martin A. Reno Emerging Scholar Prize in Computer Science.
          - Member of the Heidelberg University Marching Band, Jazz Band, Concert Band and Concert Choir.

  # Achievements
  achievements:
    enable: true
    items:
      - title: AWS Certified Cloud Practitioner
        content: Certified Cloud Practitioner - March 2025
        url: https://www.credly.com/badges/0c9956e3-8326-4141-b181-be5e85eb1af3
        image: /pictures/aws-ccp.webp
      - title: Confluent Data Streaming Engineer Foundations
        content: Data Streaming Engineer Foundations - July 2026
        url: https://certificates.confluent.io/d411a6cb-c130-4319-b708-65824ef82007
        image: /pictures/confluent-data-streaming-foundations.webp


  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: File Transfer Wizard
        content: A work in progress python based platform using streamlit that allows users to encrypt and transfer files using SFTP and PGP encryption.
        badges:
          - "Python"
          - "GNUPG"
          - "SFTP"
        links:
          - icon: fab fa-github
            url: https://github.com/Ethan-E-Campbell/File-Transfer-Wizard

  #Contact
  contact:
    enable: true
    # title: "Custom Name"
    content: "I would love to talk to you about my experience, or just to chat. Here is my email address: ethan.e.campbell@gmail.com"
    btnName: Or, feel free to press the magic button!
    btnLink: mailto:ethan.e.campbell@gmail.com

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com/Ethan-E-Campbell
      linkedin: https://www.linkedin.com/in/ethan-e-campbell/

  # List pages like blogs and posts
  listPages:
    disableFeaturedImage: false

  # Single pages like blog and post
  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  # For translations
  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    pageNotFound: "Page not found"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"

