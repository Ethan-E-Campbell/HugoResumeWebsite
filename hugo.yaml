baseURL: ""
languageCode: "en-us"
title: "Ethan Campbell - Software Engineer"
theme: hugo-profile

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "Ethan Campbell"
  description: Ethan Campbell - Software Engineer
  # staticPath: ""  # The path to serve the static files from
  favicon: "/pictures/E.svg"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: false

  theme:
    disableThemeToggle: true
    defaultTheme: "dark" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # If you want to customize the menu, you can change it here
  navbar:
    align: mx-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    # brandName: "Ethan Campbell" # Brand name for the brand | default is the title variable
    disableSearch: true
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hello there!"
    title: "My name is Ethan."
    subtitle: "I love to build things."
    content: "A software engineer with a knack for problem-solving, I specialize in leveraging AWS technologies to design reliable and replicable microservice architectures."
    image: /pictures/headshot.webp
    bottomImage:
      enable: true
    button:
      enable: true
      name: "Resume"
      url: "/resume/Ethan_Campbell_Resume.pdf"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/Ethan-E-Campbell
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/ethan-e-campbell/


  # About
  about:
    enable: true
    title: "About Me"
    image: "/pictures/my-cars.webp"
    content: |-
      I am a software engineer with a focus on AWS cloud technologies and database experience. 
      I have a Bachelor of Science in Computer Science, as well as an MBA. 
      I am currently working remotely as a senior software engineer at the [J. M. Smucker Co.](https://www.jmsmucker.com/)

    skills:
      enable: true
      title: "Here is some tech that I have used:" 
      items:
        - "Python"
        - "PL/SQL"
        - "JavaScript"
        - "AWS"
        - "Oracle"
        - "SnapLogic"
        - "Informatica"
        - "PGP/SFTP file transfer systems"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - job: " Senior Software Engineer"
        company: "J M Smucker Company"
        companyUrl: "https://www.jmsmucker.com/"
        date: "July 2025 - present"
        info:
          enable: false
        content: |
          Promoted to senior software engineer. I support Procurement, Accounts Payable, and Demand and Supply Planning operations in this position.
          - Designed and implemented a modern file transfer system built on AWS, utilizing Transfer Family, Lambda, S3, SQS, and other AWS services.
          - Wrote multiple python based lambda solutions to do last-mile delivery of files to on-prem servers / users
          - Assumed ownership of the Accounts Payable domain.
          - Driving modernization as part of the team leading the company from a 20 year old on-prem Oracle ERP to Oracle Fusion Cloud ERP.

      - job: "Software Engineer"
        company: "J M Smucker Company"
        companyUrl: "https://www.jmsmucker.com/"
        date: "June 2023 - July 2025"
        info:
          enable: false
          content: Due to my work in this position, I was promoted to a senior software engineer role in July 2025.
        content: |
          Software engineer. In this role, I supported Planning and Procurement Supply Chain operations.
          - Architected and implemented an AWS cloud stack that manipulates XML data from vendors that eventually creates a Purchase Order, under a tight one month deadline.
          - Enhanced an AWS Lambda based solution that manipulates data between on-premises Oracle databases and a cloud vendor.
          - Developed PL/SQL packages to support Demand and Supply Planning operations within the company.
          - Presented Playwright tests and API testing concepts during a large internal developers forum to over 100 attendees.

      - job: "Cloud Engineer, IT, and system administration internships"
        company: "Internships"
        date: "Aug 2021 - May 2023"
        info:
          enable: false
        content: |
          - Cloud Engineer Intern at J. M. Smucker. Offered a full time position after graduation. May 2022 - August 2022.
          - Student Helpdesk Support Technician at Heidelberg University.  August 2021 - May 2023
          - System Administrator Intern at GreenStone. May 2021 - August 2021
          - IT  System Administration and Support Intern at AgCredit. May 2020 - April 2021

