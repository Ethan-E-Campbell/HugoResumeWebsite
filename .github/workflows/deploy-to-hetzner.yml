name: Build and Deploy Hugo Website

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: environment
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.environment}}
    env:
      HETZNER_FTP_HOST: ${{ secrets.HETZNER_FTP_HOST }}
      HETZNER_FTP_USER: ${{ secrets.HETZNER_FTP_USER }}
      HETZNER_FTP_PASS: ${{ secrets.HETZNER_FTP_PASS }}

    steps:
      - name: Validate FTP secrets
        shell: bash
        run: |
          if [ -z "$HETZNER_FTP_HOST" ] || [ -z "$HETZNER_FTP_USER" ] || [ -z "$HETZNER_FTP_PASS" ]; then
            echo "Missing one or more required FTP secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build Hugo site
        run: hugo --minify

      - name: Verify publish directory
        shell: bash
        run: |
          if [ ! -d public ]; then
            echo "Publish directory 'public' was not found."
            exit 1
          fi
          echo "Publish directory contents:"
          find public -maxdepth 2 -type f | head -20

      - name: Deploy via FTP to Hetzner Webhosting
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.HETZNER_FTP_HOST }}
          username: ${{ env.HETZNER_FTP_USER }}
          password: ${{ env.HETZNER_FTP_PASS }}
          protocol: ftps
          local-dir: public/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github*
