name: Build and Deploy Hugo Website

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: environment
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Validate FTP secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.HETZNER_FTP_HOST }}" ] || [ -z "${{ secrets.HETZNER_FTP_USER }}" ] || [ -z "${{ secrets.HETZNER_FTP_PASS }}" ]; then
            echo "Missing one or more required FTP secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build Hugo site
        run: hugo --minify

      - name: Deploy via FTP to Hetzner Webhosting
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HETZNER_FTP_HOST }}
          username: ${{ secrets.HETZNER_FTP_USER }}
          password: ${{ secrets.HETZNER_FTP_PASS }}
          protocol: ftps
          local-dir: public/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github*
