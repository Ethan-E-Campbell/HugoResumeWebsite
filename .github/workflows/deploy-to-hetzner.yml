name: Build and Deploy Hugo Website
run-name: Deploy to ${{ inputs.environment }} by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: environment

jobs:
  deploy-to-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.environment }}
    env:
      HETZNER_SFTP_HOST: ${{ secrets.HETZNER_FTP_HOST }}
      HETZNER_SFTP_USER: ${{ secrets.HETZNER_FTP_USER }}
      HETZNER_SFTP_KEY: ${{ secrets.HETZNER_SFTP_KEY }}
      HETZNER_SFTP_FOLDER: ${{ vars.FOLDER }}

    steps:

      - name: Validate SFTP secrets and folder
        shell: bash
        run: |
          if [ -z "$HETZNER_SFTP_HOST" ] || [ -z "$HETZNER_SFTP_USER" ] || [ -z "$HETZNER_SFTP_KEY" ] || [ -z "$HETZNER_SFTP_FOLDER" ]; then
            echo "Missing one or more required SFTP secrets or HETZNER_SFTP_FOLDER."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build Hugo site
        run: hugo --gc --minify

      - name: Verify publish directory
        shell: bash
        run: |
          if [ ! -d public ]; then
            echo "Publish directory 'public' was not found."
            exit 1
          fi
          echo "Publish directory contents:"
          find public -maxdepth 2 -type f | head -20

      - name: delete fontawesome-6 folder
        shell: bash
        run: |
          if [ -d public/fontawesome-6 ]; then
            echo "Deleting 'public/fontawesome-6' directory."
            rm -rf public/fontawesome-6
          else
            echo "'public/fontawesome-6' directory does not exist. Skipping deletion."
          fi

      - name: Deploy via SFTP to Hetzner Webhosting
        shell: bash
        run: |
          set -x
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HETZNER_SFTP_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "--- scanning host ---"
          ssh-keyscan -H "$HETZNER_SFTP_HOST" >> ~/.ssh/known_hosts || true
          echo "--- starting sftp ---"
          TARGET="$HETZNER_SFTP_FOLDER"
          echo "Deploy target folder: $TARGET"
          SFTP_BATCH=$(mktemp)
          printf '%s\n' "cd \"$TARGET\"" "lcd public" "put -r ." "bye" > "$SFTP_BATCH"
          sftp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes -b "$SFTP_BATCH" \
            "$HETZNER_SFTP_USER@$HETZNER_SFTP_HOST"
          rm -f "$SFTP_BATCH"
          echo "--- sftp finished ---"
