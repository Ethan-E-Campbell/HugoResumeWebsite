name: Refresh Prod to Dev
run-name: Deploy to ${{ inputs.environment }} by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: environment

jobs:
  deploy-to-hetzner:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.environment }}
    env:
      HETZNER_SFTP_HOST: ${{ secrets.HETZNER_FTP_HOST }}
      HETZNER_SFTP_USER: ${{ secrets.HETZNER_FTP_USER }}
      HETZNER_SFTP_KEY: ${{ secrets.HETZNER_SFTP_KEY }}
      HETZNER_SFTP_FOLDER: ${{ vars.FOLDER }}

    steps:

      - name: Validate SFTP secrets and folder
        shell: bash
        run: |
          if [ -z "$HETZNER_SFTP_HOST" ] || [ -z "$HETZNER_SFTP_USER" ] || [ -z "$HETZNER_SFTP_KEY" ] || [ -z "$HETZNER_SFTP_FOLDER" ]; then
            echo "Missing one or more required SFTP secrets or HETZNER_SFTP_FOLDER."
            exit 1
          fi

      - name: Deploy via SFTP to Hetzner Webhosting
        shell: bash
        run: |
          set -x
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HETZNER_SFTP_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "--- scanning host ---"
          ssh-keyscan -H "$HETZNER_SFTP_HOST" >> ~/.ssh/known_hosts || true
          echo "--- starting sftp refresh ---"

          echo "-- starting download of PROD"
          prod_folder = "/public_html"
          mkdir -p "$prod_folder"
          SFTP_SOURCE_BATCH=$(mktemp)
          printf '%s\n' "lcd /public_html" "get -r \"/public_html\"" "bye" > "$SFTP_SOURCE_BATCH"
          sftp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes -b "$SFTP_SOURCE_BATCH" \
            "$HETZNER_SFTP_USER@$HETZNER_SFTP_HOST"

          TARGET="$HETZNER_SFTP_FOLDER"
          echo "Deploy target folder: $TARGET"
          SFTP_TARGET_BATCH=$(mktemp)
          printf '%s\n' "cd \"$TARGET\"" "lcd /public_html" "put -r ." "bye" > "$SFTP_TARGET_BATCH"
          sftp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes -b "$SFTP_TARGET_BATCH" \
            "$HETZNER_SFTP_USER@$HETZNER_SFTP_HOST"
          rm -f "$SFTP_BATCH"
          echo "--- sftp finished ---"
